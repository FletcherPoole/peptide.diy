<!-- COOKIE CONSENT -->
<div class="cookie-consent" id="cookie-consent" role="dialog" aria-live="polite" aria-label="Cookie consent" hidden>
  <p class="cookie-consent-text">
    We use analytics cookies to understand how the site is used. They stay off until you accept.
    See our <a href="{{ '/cookie-policy.html' | relative_url }}">Cookie Policy</a>.
  </p>
  <div class="cookie-consent-actions">
    <button type="button" class="btn btn-ghost" onclick="setCookieConsent('denied')">Decline</button>
    <button type="button" class="btn btn-primary" onclick="setCookieConsent('granted')">Accept</button>
  </div>
</div>
