      {% for group in site.data.faq %}
      <div class="faq-group">
        <div class="faq-group-title">{{ group.title }}</div>
        {% for item in group.items %}
        {% assign faq_id = forloop.parentloop.index | append: '-' | append: forloop.index %}
        <div class="faq-item">
          <button type="button" class="faq-q" aria-expanded="false" aria-controls="faq-a-{{ faq_id }}" onclick="toggleFaq(this)">{{ item.q }} <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
          <div class="faq-a" id="faq-a-{{ faq_id }}">{% if item.a_html %}{{ item.a_html | markdownify }}{% else %}{{ item.a }}{% endif %}</div>
        </div>
        {% endfor %}
      </div>
      {% endfor %}
